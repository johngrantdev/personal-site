services:
  cms:
    image: personal-site-cms:latest
    container_name: personal-site-cms
    depends_on:
      - postgresql
    env_file: .env.prod
    environment:
      UPLOADS_DIR: /app/uploads
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - backend
    restart: unless-stopped
    volumes:
      - media:/app/uploads

  web:
    image: personal-site-web:latest
    container_name: personal-site-web
    depends_on:
      - postgresql
    env_file: .env.prod
    environment:
      UPLOADS_DIR: /app/uploads
      PORT: 4321
    ports:
      - '127.0.0.1:4321:4321'
    networks:
      - backend
    restart: unless-stopped
    volumes:
      - media:/app/uploads:ro

  postgresql:
    image: postgres:15.4
    container_name: personal-site-postgresql
    env_file: .env.prod
    expose:
      - '5432'
    networks:
      - backend
    restart: unless-stopped
    volumes:
      - data:/var/lib/postgresql/data

networks:
  backend:
    driver: bridge

volumes:
  data:
  media:
